name: Deploy

# Merge to main → CI → (green) → this: build the images once, tag them with
# the commit, push to GHCR, and roll the server to them. A red CI deploys
# nothing. Setup and secrets: docs/deploy.md.
#
# Rolling back is re-running an older run of this workflow ("Re-run all
# jobs"): it deploys that run's commit again, images already in GHCR.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand: Actions → Deploy → Run workflow — deploys the tip of main.
  workflow_dispatch:

# One deploy at a time, and never cancel one half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REGISTRY: ghcr.io/slawczech

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            context: app
          - name: agent
            context: agent
          - name: frontend
            context: frontend
          - name: postgres
            context: infra/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Hetzner CX/CPX are x86. An ARM server (CAX) needs linux/arm64 here.
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/corvus-${{ matrix.name }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Secrets live in the "production" environment (Settings → Environments).
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key: a server that answers with another key is not ours.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host corvus\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config

      - name: Copy the server-side files
        run: |
          scp infra/deploy/docker-compose.prod.yml infra/deploy/Caddyfile \
              infra/deploy/deploy.sh infra/deploy/backup.sh corvus:/srv/corvus/

      - name: Log the server in to GHCR for this deploy
        # The job's own token, valid only while this job runs — no long-lived
        # registry credential is ever stored on the server.
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh corvus "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Deploy ${{ env.SHA }}
        run: ssh corvus "/srv/corvus/deploy.sh ${{ env.SHA }}"

      - name: Log the server out of GHCR
        if: always()
        run: ssh corvus "docker logout ghcr.io" || true
