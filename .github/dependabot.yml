# Monthly, with minor and patch updates grouped into one PR per ecosystem and
# directory. Major updates get no PR at all: one person reviews these and CD
# deploys on merge, so a major is a change someone decides to make.
version: 2

updates:
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned on purpose: the upgrade is its own change, see docs/technical-debt.md.
      - dependency-name: fastapi
      - dependency-name: starlette

  - package-ecosystem: uv
    directory: /agent
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /app
      - /agent
      - /frontend
      - /infra/postgres
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Also keeps Postgres off a new major: it cannot read the old data directory.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
