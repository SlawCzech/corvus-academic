full_name = "Kazimierz Pawlak"
field_of_study = "Ekonomia"
thesis_type = "master_article"

[[timeline]]
date = 2025-10-07
note = """Pierwsze spotkanie – przyszedł kwadrans po Kargulu i od progu zapytał, o czym tamten pisze. Tematu jeszcze nie ma. Interesuje go rolnictwo, sprawy własności ziemi i „żeby było sprawiedliwie”. Zna realia wsi bardzo dobrze, teorię słabiej. Prosiłem o trzy propozycje tematu na następne spotkanie i o przeczytanie czegoś z ekonomii instytucjonalnej na początek."""

[[timeline]]
date = 2025-12-16
note = """Propozycji tematu nadal brak. Rozważa: scalanie gruntów, dziedziczenie gospodarstw, sąsiedzką pomoc w rolnictwie. Każdy pomysł porzuca, gdy dowiaduje się, że graniczy z tematem Kargula – albo podejmuje go właśnie z tego powodu. Ma za sobą North i Ostrom, czyta ze zrozumieniem. Dopytywał, czy w pracy magisterskiej można odpowiedzieć na cudzą pracę magisterską. Wyjaśniłem, że to nie jest gatunek polemiczny."""

[[timeline]]
date = 2026-03-24
note = """Wciąż bez tematu, a czas ucieka. Najbliżej mu do pytania, dlaczego sąsiedzi w jednych sprawach potrafią się dogadać (wspólne maszyny, pomoc przy żniwach, wspólny kot), a w innych nie – ciekawy problem dla ekonomii instytucjonalnej i dobry punkt wyjścia. Warunek: więcej niż jeden przypadek i nie własna rodzina. Do następnego spotkania ma wybrać i sformułować pytanie badawcze."""
