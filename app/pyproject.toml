[project]
name = "app"
version = "0.1.0"
description = "Corvus app service — identity, document extraction, mentoring domain"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "bcrypt>=4.3.0",
    "pydantic-settings>=2.16.2",
    "redis>=6.2.0",
    "structlog>=25.5.0",
    "uvicorn>=0.54.0",
    "pyjwt>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi-limiter>=0.1.6",
    "email-validator>=2.2.0",
    "httpx>=0.28.1",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fpdf2>=2.8.9",
    "import-linter>=2.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"main.py" = ["B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=xml"
pythonpath = ["."]

[tool.coverage.run]
# Async SQLAlchemy runs every query in a greenlet: without this, coverage
# loses the trace at the first `await` that touches the database, and the
# rest of the endpoint reads as never run.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "identity nie zna mentoringu ani wytycznych"
type = "forbidden"
source_modules = ["src.identity"]
forbidden_modules = ["src.mentoring", "src.guidelines"]

[[tool.importlinter.contracts]]
name = "shared jest naprawdę wspólne — nie zna żadnego bounded contextu"
type = "forbidden"
source_modules = ["src.shared"]
forbidden_modules = [
    "src.identity",
    "src.mentoring",
    "src.document",
    "src.guidelines",
]

[[tool.importlinter.contracts]]
name = "mentoring sięga po wytyczne tylko z infrastruktury (guidelines_port + adapter)"
type = "forbidden"
source_modules = ["src.mentoring.domain", "src.mentoring.application"]
forbidden_modules = ["src.guidelines"]

[[tool.importlinter.contracts]]
name = "wytyczne nie znają mentoringu"
type = "forbidden"
source_modules = ["src.guidelines"]
forbidden_modules = ["src.mentoring"]
