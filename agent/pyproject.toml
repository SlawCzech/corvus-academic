[project]
name = "agent"
version = "0.1.0"
description = "Corvus agent service — LangGraph analysis + review"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "cryptography>=48.0.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langfuse>=4.18.0",
    "langgraph>=1.2.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.0",
    "redis>=7.4.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "structlog>=25.5.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "celery-types>=0.26.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
# Prompt text: these files are mostly literals sent to the LLM, and rewrapping
# a line there changes the prompt rather than the formatting.
"src/application/prompts/*.py" = ["E501"]
"src/application/nodes/review.py" = ["E501"]
# The runner sets required settings in the environment before importing `src`.
"evals/run.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=xml"

[tool.coverage.run]
# Async SQLAlchemy runs every query in a greenlet: without this, coverage
# loses the trace at the first `await` that touches the database.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
