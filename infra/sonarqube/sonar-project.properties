sonar.projectKey=corvus
sonar.projectName=Corvus

# Three packages, one project: two Python services and the Next.js frontend.
sonar.sources=app/src,agent/src,frontend/app,frontend/components,frontend/hooks,frontend/lib
sonar.tests=app/tests,agent/tests,frontend/components/__tests__,frontend/hooks/__tests__

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage/coverage-app/coverage.xml,coverage/coverage-agent/coverage.xml

sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,**/alembic*/versions/**

# Prompt files are literal text sent to a model; line length and duplication
# rules say nothing useful about them.
sonar.cpd.exclusions=agent/src/application/prompts/**,agent/src/application/nodes/review.py
