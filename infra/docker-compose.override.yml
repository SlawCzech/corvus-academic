# Dev overrides — source mounted into containers, DEBUG=true turns on uvicorn
# --reload in the entrypoints. Loaded only via `make dev` / `make dev-build`;
# docker compose does NOT pick it up automatically, because the base file is
# always passed with an explicit -f.
#
# What actually hot-reloads:
#   app/src/**, agent/src/**   yes — directory mounts, picked up in a few seconds
#   main.py                    NO  — single-file bind mount; the content reaches
#                                    the container, but on macOS the mtime change
#                                    does not, so uvicorn's StatReload never fires.
#                                    Restart that container after editing main.py.
services:
  frontend:
    build:
      target: deps
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    environment:
      - NODE_ENV=development

  app:
    volumes:
      - ../app/src:/app/src
      - ../app/main.py:/app/main.py
      - ../app/alembic_identity:/app/alembic_identity
    environment:
      - DEBUG=true
    # entrypoint.sh: alembic upgrade head → seed_admin → uvicorn :8000
    # No command override — uses Dockerfile CMD ["/app/entrypoint.sh"]

  agent:
    volumes:
      - ../agent/src:/app/src
      - ../agent/main.py:/app/main.py
      - ../agent/alembic:/app/alembic
    environment:
      - DEBUG=true
    # entrypoint.sh: alembic upgrade head → uvicorn :8002
    # No command override — uses Dockerfile CMD ["/app/entrypoint.sh"]

  agent-worker:
    volumes:
      - ../agent/src:/app/src
    environment:
      - DEBUG=true
    command: celery -A src.infrastructure.celery_app worker --loglevel=debug
