# Production: one VPS, images from GHCR, only Caddy reachable from outside.
#
# Differences from infra/docker-compose.yml, and why:
#   - images, not builds — CD builds them once (tagged with the commit) and
#     the server only pulls; IMAGE_TAG picks the version, which is also how a
#     deploy rolls back;
#   - no `ports:` except Caddy's 80/443 — Postgres, Redis and the agent
#     answer only on the internal network. Docker's published ports
#     bypass ufw, so "not published" is the only firewall that holds here;
#   - no Flower — it would show every queued task;
#   - no Ollama — chat runs on the promoters' own keys (ADR 0013) and
#     nothing embeds anything (ADR 0021).
#
# Used by infra/deploy/deploy.sh; secrets come from /srv/corvus/.env, which
# never leaves the server (template: infra/deploy/env.production.example).

name: corvus

services:
  caddy:
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CORVUS_DOMAIN: ${CORVUS_DOMAIN:?set CORVUS_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    image: ghcr.io/slawczech/corvus-frontend:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
    environment:
      APP_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ghcr.io/slawczech/corvus-app:${IMAGE_TAG}
    env_file: .env
    environment:
      ENVIRONMENT: production
      AGENT_URL: http://agent:8002
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://corvus:${POSTGRES_PASSWORD}@postgres:5432/corvus
      CORS_ORIGINS: '["https://${CORVUS_DOMAIN}"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent:
    image: ghcr.io/slawczech/corvus-agent:${IMAGE_TAG}
    env_file: .env
    environment: &agent-env
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://corvus:${POSTGRES_PASSWORD}@postgres:5432/corvus
      LANGCHAIN_TRACING_V2: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent-worker:
    image: ghcr.io/slawczech/corvus-agent:${IMAGE_TAG}
    # Four reviews at once: a full review holds a slot for a few minutes, and
    # with two slots a handful of promoters before a defence week queued. Each
    # slot is a process of ~170 MB idle (more while it holds a long thesis);
    # the VPS has 8 GB.
    command: celery -A src.infrastructure.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      <<: *agent-env
      # SIGTERM from `docker compose` starts a cold shutdown, not a warm one:
      # running tasks get `worker_soft_shutdown_timeout` to finish, then go
      # back to the queue at once. A warm shutdown waits for them, Docker
      # kills it after the grace period, and the killed task sits unacked in
      # Redis until the visibility timeout (`celery_app.py`).
      REMAP_SIGTERM: SIGQUIT
    # Above the soft shutdown's 30 s, with room for the cold shutdown after it.
    stop_grace_period: 60s
    depends_on:
      agent:
        condition: service_healthy
    # The image's HEALTHCHECK asks the HTTP API, which a worker does not
    # serve; ask Celery over the broker instead (as in the dev compose).
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.infrastructure.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persistent on purpose: Redis holds the list of revoked access tokens
    # (logout), which a restart must not forget, and the queued tasks. The
    # promoter's key in a task message is sealed (ADR 0012), so a snapshot on
    # disk holds a token, not the key.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: ghcr.io/slawczech/corvus-postgres:${IMAGE_TAG}
    environment:
      POSTGRES_USER: corvus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: corvus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvus -d corvus"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  postgres_data:
