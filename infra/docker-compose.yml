services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # One service, one variable: the frontend talks only to `app`, which
      # serves identity, students, drafts and actions.
      - APP_URL=http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  agent:
    # Named explicitly so `agent-worker` can run the same artifact. Without the
    # name, compose derives one per service and builds ../agent twice: the API
    # and the worker then run different code, and a rebuild of one silently
    # leaves the other on a week-old image — which is exactly how a fixed node
    # kept producing the old output.
    image: corvus-agent
    build:
      context: ../agent
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  agent-worker:
    # The same image as `agent`, built once by that service — the worker is the
    # same code with a different command.
    image: corvus-agent
    command: celery -A src.infrastructure.celery_app worker --loglevel=info
    env_file:
      - ../.env
    depends_on:
      agent:
        condition: service_healthy
    # The image's own HEALTHCHECK asks the HTTP API on :8002, which a Celery
    # worker does not serve — inherited unchanged, it reports every healthy
    # worker as unhealthy. Ask Celery instead, over the broker it is listening on.
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.infrastructure.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  flower:
    image: mher/flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    command: celery --broker=redis://redis:6379/0 flower
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    # Postgres 16 + pgvector, built from infra/postgres/Dockerfile — an old
    # migration (agent 0004) still creates the extension on a fresh database.
    build:
      context: ./postgres
      dockerfile: Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: thesis_reviewer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d thesis_reviewer"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  jenkins_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
