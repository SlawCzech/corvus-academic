# Hooks that run in under a second on the files you touched.
#
# Deliberately *not* here: pytest, and pyright. The app suite takes ~55 s
# (bcrypt, by design) and a type-check needs each service's whole venv — hooks
# that slow are hooks people disable with --no-verify, and then nothing runs.
# Both are gates in .github/workflows/ci.yml instead, where they belong.
#
# Install once:  uvx pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # Compose files and workflows; nothing else here is YAML.
        files: ^(infra|\.github)/.*\.ya?ml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      # Each service carries its own pyproject; ruff resolves the config from
      # the file's own directory, so one hook covers both.
      # Keep `rev` on the ruff the services lock: two formatter versions
      # would reformat each other's output back and forth.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint . --max-warnings 0'
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs)$
        pass_filenames: false
